name: Calidad del proyecto

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependencias
        run: dotnet restore SIGEBI.slnx

      - name: Verificar formato
        run: dotnet format SIGEBI.slnx --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build SIGEBI.slnx -c Release --no-restore --warnaserror

      - name: Ejecutar pruebas
        run: dotnet test SIGEBI.Tests/SIGEBI.Tests.csproj -c Release --no-build --logger "trx;LogFileName=resultados.trx"

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: SIGEBI.Tests/TestResults/resultados.trx

